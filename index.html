<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Castle Battle Arena</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

    <!-- Babylon.js loaded before modules -->

</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- ES Module entry point - all dependencies are imported automatically -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
